name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Runs after Build so generated declarations (next-env.d.ts,
      # .next/types) exist if the app ever starts depending on them.
      - name: Typecheck
        run: npx tsc --noEmit

      # eslint is a blocking gate: Phase 4 (HLT-5) drove the error count to
      # zero. `eslint .` exits non-zero on any error (warnings do not fail it),
      # so new errors now break CI.
      - name: Lint
        run: npx eslint .

      - name: Test
        run: npm run test --if-present

  # End-to-end (Playwright). Separate job so a browser/DB failure is
  # attributable at a glance and doesn't gate the fast unit lane above.
  #
  # Runs against a THROWAWAY Postgres service container (never prod). With
  # E2E_DATABASE_URL set, playwright.config.ts boots `next start` against it,
  # so the public smoke suite PLUS the DB-only core flows (register, settings)
  # execute for real. The compose/schedule/invite→post flows stay skipped:
  # they need a blob store + a connected-platform OAuth double (see
  # app/e2e/README.md), so E2E_STUBS_READY is deliberately NOT set here —
  # skipped is honest ("not exercised"); a pass without those doubles would be
  # a lie.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vibesocials_e2e
        ports:
          - 5432:5432
        # Wait for the DB to accept connections before the steps run.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Prisma CLI reads DATABASE_URL; playwright.config.ts's webServer reads
      # E2E_DATABASE_URL (and threads it into the booted server as DATABASE_URL).
      # Same throwaway service DB either way.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vibesocials_e2e
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vibesocials_e2e
      # Fixed test secret: the encoder and the running server must agree on it
      # for the login flow's session cookie to decode. Throwaway, not a real
      # credential.
      NEXTAUTH_SECRET: e2e-ci-secret-not-for-production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations to the test database
        run: npx prisma migrate deploy

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E (smoke + DB-only core flows)
        run: npx playwright test
