name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Runs after Build so generated declarations (next-env.d.ts,
      # .next/types) exist if the app ever starts depending on them.
      - name: Typecheck
        run: npx tsc --noEmit

      # eslint is a blocking gate: Phase 4 (HLT-5) drove the error count to
      # zero. `eslint .` exits non-zero on any error (warnings do not fail it),
      # so new errors now break CI.
      - name: Lint
        run: npx eslint .

      - name: Test
        run: npm run test --if-present
